---
- name: Skip on WSL
  ansible.builtin.meta: end_role
  when: ansible_host_environment_is_wsl | default(false) | bool

- name: Install hyprland packages
  become: true
  community.general.pacman:
    name: "{{ hyprland_packages }}"
    state: present

- name: Ensure hyprland config directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/hypr/modules"
    state: directory
    mode: "0755"

- name: Deploy hyprland main config
  ansible.builtin.template:
    src: hyprland.lua.j2
    dest: "{{ user_home }}/.config/hypr/hyprland.lua"
    mode: "0644"
    backup: true

- name: Deploy hyprland module configs
  ansible.builtin.copy:
    src: "modules/{{ item }}"
    dest: "{{ user_home }}/.config/hypr/modules/{{ item }}"
    mode: "0644"
  loop:
    - layout.lua
    - binds.lua
    - input.lua

# Hyprland >= 0.57 reads hyprland.lua only; drop the legacy hyprlang files.
# env.conf is replaced by env.lua (written by the nvidia/theming roles and bootstrap).
- name: Remove legacy hyprlang configs
  ansible.builtin.file:
    path: "{{ user_home }}/.config/hypr/{{ item }}"
    state: absent
  loop:
    - hyprland.conf
    - modules/env.conf
    - modules/layout.conf
    - modules/binds.conf
    - modules/input.conf

- name: Deploy hyprlock config
  ansible.builtin.copy:
    src: hyprlock.conf
    dest: "{{ user_home }}/.config/hypr/hyprlock.conf"
    mode: "0644"

- name: Deploy hypridle config
  ansible.builtin.copy:
    src: hypridle.conf
    dest: "{{ user_home }}/.config/hypr/hypridle.conf"
    mode: "0644"

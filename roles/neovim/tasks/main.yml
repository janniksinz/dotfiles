---
- name: Install neovim packages
  ansible.builtin.include_tasks:
    file: "install-{{ 'debian' if ansible_os_family == 'Debian' else 'arch' }}.yml"

- name: Ensure neovim config directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/nvim"
    state: directory
    mode: "0755"

- name: Clone kickstart.nvim
  ansible.builtin.git:
    repo: https://github.com/nvim-lua/kickstart.nvim.git
    dest: "{{ user_home }}/.config/nvim"
    version: master
    update: false

- name: Enable custom plugins import in kickstart
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.config/nvim/init.lua"
    regexp: '^\s*--\s*\{ import = .custom\.plugins. \}'
    line: "  { import = 'custom.plugins' },"

- name: Ensure custom plugins directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/nvim/lua/custom/plugins"
    state: directory
    mode: "0755"

- name: Deploy custom neovim plugins
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ user_home }}/.config/nvim/lua/custom/plugins/{{ item }}"
    mode: "0644"
  loop:
    - harpoon.lua
    - codecompanion.lua
    - undotree.lua
    - remap.lua

- name: Install neovim plugins
  ansible.builtin.command:
    cmd: nvim --headless "+Lazy! sync" +qa
  changed_when: false

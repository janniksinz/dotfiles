---
- name: Check if DaVinci Resolve is already installed
  ansible.builtin.command:
    cmd: pacman -Q davinci-resolve
  register: davinci_installed
  changed_when: false
  failed_when: false

- name: Skip role if DaVinci Resolve is already installed
  ansible.builtin.meta: end_role
  when: davinci_installed.rc == 0

# Find source ZIP
- name: Look for DaVinci Resolve ZIP in downloads
  ansible.builtin.find:
    paths: "{{ davinci_resolve_downloads_dir }}"
    patterns: "DaVinci_Resolve_*_Linux.zip"
    file_type: file
  register: resolve_zips

- name: Set resolved ZIP path (prefer configured version, fall back to newest)
  ansible.builtin.set_fact:
    davinci_resolve_zip_path: >-
      {{
        resolve_zips.files
        | selectattr('path', 'search', davinci_resolve_version)
        | map(attribute='path')
        | first
        | default(
            resolve_zips.files
            | sort(attribute='mtime', reverse=true)
            | map(attribute='path')
            | first
            | default('')
          )
      }}

- name: Fail if no DaVinci Resolve ZIP found
  ansible.builtin.fail:
    msg: |
      No DaVinci Resolve ZIP found in {{ davinci_resolve_downloads_dir }}!

      Please download manually from:
        https://www.blackmagicdesign.com/support/family/davinci-resolve-and-fusion

      Expected filename pattern: DaVinci_Resolve_<version>_Linux.zip

      Then re-run the playbook.
  when: davinci_resolve_zip_path == ''

- name: Extract version from found ZIP
  ansible.builtin.set_fact:
    davinci_resolve_detected_version: "{{ davinci_resolve_zip_path | basename | regex_replace('^DaVinci_Resolve_(.+)_Linux\\.zip$', '\\1') }}"

- name: Display detected DaVinci Resolve version
  ansible.builtin.debug:
    msg: "Installing DaVinci Resolve {{ davinci_resolve_detected_version }}"

# Install dependencies via yay (skip gtk2 and qt5-webengine — incompatible with GCC 16+)
- name: Install dependencies
  kewlfft.aur.aur:
    name: "{{ davinci_resolve_deps }}"
    use: yay
    state: present
  become: "{{ ansible_facts['user_id'] == 'root' }}"
  become_user: "{{ host_user }}"

# Build via AUR PKGBUILD with --nodeps
- name: Ensure builds directory exists
  ansible.builtin.file:
    path: "{{ davinci_resolve_builds_dir }}/davinci-resolve"
    state: directory
    mode: "0755"

- name: Clone davinci-resolve AUR package
  ansible.builtin.git:
    repo: https://aur.archlinux.org/davinci-resolve.git
    dest: "{{ davinci_resolve_builds_dir }}/davinci-resolve"
    depth: 1
    force: true

- name: Copy DaVinci Resolve ZIP to build directory
  ansible.builtin.copy:
    src: "{{ davinci_resolve_zip_path }}"
    dest: "{{ davinci_resolve_builds_dir }}/davinci-resolve/{{ davinci_resolve_zip_path | basename }}"
    remote_src: true
    mode: "0644"

- name: Build DaVinci Resolve package (skipping deps)
  ansible.builtin.command:
    cmd: makepkg -s --noconfirm --skipchecksums --skippgpcheck --nodeps
    chdir: "{{ davinci_resolve_builds_dir }}/davinci-resolve"
    creates: "{{ davinci_resolve_builds_dir }}/davinci-resolve/davinci-resolve-{{ davinci_resolve_detected_version }}-1-x86_64.pkg.tar.zst"

- name: Find built package
  ansible.builtin.find:
    paths: "{{ davinci_resolve_builds_dir }}/davinci-resolve"
    patterns: "davinci-resolve-*.pkg.tar*"
    file_type: file
  register: built_package

- name: Install DaVinci Resolve package (skipping dep checks)
  become: true
  ansible.builtin.command:
    cmd: "pacman -U --nodeps --nodeps --noconfirm {{ built_package.files[0].path }}"

# Prevent onboarding wizard from blocking startup (requires qt5-webengine)
- name: Create DaVinci Resolve config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/DaVinciResolve/configs"
    state: directory
    mode: "0755"

- name: Disable onboarding wizard
  ansible.builtin.copy:
    content: ""
    dest: "{{ ansible_facts.env.HOME }}/.local/share/DaVinciResolve/.onboarding_complete"
    mode: "0644"
    force: false

# Configure desktop entry for XWayland on Hyprland
- name: Configure desktop entry for XWayland
  become: true
  ansible.builtin.lineinfile:
    path: /usr/share/applications/com.blackmagicdesign.resolve.desktop
    regexp: '^Exec='
    line: "Exec=env QT_QPA_PLATFORM=xcb /opt/resolve/bin/resolve %u"
